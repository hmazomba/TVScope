name: Phase 0 Browser Diagnostics
on:
  push:
    paths:
      - 'phase0/**'
      - '.github/workflows/phase0.yml'
  pull_request:
    paths:
      - 'phase0/**'
      - '.github/workflows/phase0.yml'
  workflow_dispatch:

jobs:
  phase0-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: phase0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned WebSocket dependency
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run Phase 0 HTTP and WebSocket tests
        run: npm test
